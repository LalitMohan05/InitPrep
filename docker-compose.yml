
services:

    postgres:
        image: postgres:17
        container_name: initprep-postgres

        restart: unless-stopped

        environment:
            POSTGRES_DB: ${POSTGRES_DB:-auth_db}
            POSTGRES_USER: ${POSTGRES_USER:-lalitdo}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}

        ports:
            - "5432:5432"

        volumes:
            - postgres_data:/var/lib/postgresql/data

        networks:
            - initprep-network


    pgadmin:
        image: dpage/pgadmin4
        container_name: initprep-pgadmin

        restart: unless-stopped

        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in the ignored .env file}

        ports:
            - "5050:80"

        depends_on:
            - postgres

        networks:
            - initprep-network



volumes:
    postgres_data:


networks:
    initprep-network:
