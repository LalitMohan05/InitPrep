server:
    port: ${PORT:8082}

spring:
    application:
        name: user-service

    datasource:
        url: ${USER_DATABASE_URL:jdbc:postgresql://localhost:5432/user_db}
        username: ${USER_DATABASE_USERNAME:lalit}
        password: ${USER_DATABASE_PASSWORD}

    jpa:
        hibernate:
            ddl-auto: ${JPA_DDL_AUTO:update}
        show-sql: ${JPA_SHOW_SQL:false}

jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
