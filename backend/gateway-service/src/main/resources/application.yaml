server:
    port: 8080

spring:
    cloud:
        gateway:
            server:
                webflux:
                    routes:

                        - id: auth-service
                          uri: http://localhost:8081
                          predicates:
                              - Path=/api/auth/**

                        - id: user-service
                          uri: http://localhost:8082
                          predicates:
                              - Path=/api/users/**

                        - id: interview-service
                          uri: http://localhost:8083
                          predicates:
                              - Path=/api/questions/**

                        - id: attempt-service
                          uri: http://localhost:8084
                          predicates:
                              - Path=/api/attempts/**
