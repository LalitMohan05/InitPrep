server:
    port: ${PORT:8080}

spring:
    cloud:
        gateway:
            server:
                webflux:
                    routes:

                        - id: auth-service
                          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
                          predicates:
                              - Path=/api/auth/**

                        - id: user-service
                          uri: ${USER_SERVICE_URL:http://localhost:8082}
                          predicates:
                              - Path=/api/users/**

                        - id: interview-service
                          uri: ${INTERVIEW_SERVICE_URL:http://localhost:8083}
                          predicates:
                              - Path=/api/questions/**

                        - id: attempt-service
                          uri: ${ATTEMPT_SERVICE_URL:http://localhost:8084}
                          predicates:
                              - Path=/api/attempts/**

                    globalcors:
                        add-to-simple-url-handler-mapping: true
                        cors-configurations:
                            '[/**]':
                                allowed-origins: "${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}"
                                allowed-methods:
                                    - GET
                                    - POST
                                    - PUT
                                    - PATCH
                                    - DELETE
                                    - OPTIONS
                                allowed-headers:
                                    - Authorization
                                    - Content-Type
                                allow-credentials: true
                                max-age: 3600
